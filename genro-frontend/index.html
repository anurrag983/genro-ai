<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Responsive & Native App Feel -->
  <meta 
    name="viewport" 
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" 
  />

  <!-- Theme -->
  <meta name="theme-color" content="#0b1121" />
  <meta name="color-scheme" content="dark light" />

  <!-- SEO -->
  <title>Genro AI • AI Personalized Learning Platform</title>
  <meta name="description" content="Genro AI is a premium AI-powered personalized learning platform for NEET and CBSE students featuring smart quizzes, AI tutor, analytics, and adaptive learning." />
  <meta name="keywords" content="Genro AI, AI Learning, NEET, CBSE, JEE, Study Platform, AI Tutor" />
  <meta name="author" content="Genro AI" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph (For WhatsApp/Facebook Previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Genro AI • AI Personalized Learning" />
  <meta property="og:description" content="Learn smarter with AI powered personalized education." />
  <meta property="og:image" content="/logo.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Genro AI" />
  <meta name="twitter:description" content="AI Powered Personalized Learning Platform" />

  <!-- Icons -->
  <link rel="icon" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- 🚀 Tailwind CSS (Zaroori hai styling ke liye) -->
  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-[#0b1121] text-slate-100 antialiased" style="font-family: Inter, sans-serif;">

</html>
